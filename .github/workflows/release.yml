name: Release

# Every push to main: build Focus, prove it works on a real Windows desktop (panel placement,
# blurred reminder, caffeine prompt, and a full self-update), then publish it as the latest
# release. Installed apps update themselves from that release's update.json.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic tests
        run: node --test test/core.test.js
      - id: v
        run: echo "version=4.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set_version() { jq --arg v "$1" '.version = $v' neutralino.config.json > tmp.json && mv tmp.json neutralino.config.json; }
          npx -y @neutralinojs/neu@11.8.0 update
          # The same app with a higher version number, used only to test updating.
          set_version "$VERSION.1"
          npx -y @neutralinojs/neu@11.8.0 build --release
          cp dist/Focus/resources.neu next-resources.neu
          rm -rf dist
          set_version "$VERSION"
          npx -y @neutralinojs/neu@11.8.0 build --release
          mkdir out
          cd dist/Focus
          zip -j ../../out/Focus-windows.zip Focus-win_x64.exe resources.neu
          zip -j ../../out/Focus-mac.zip Focus-mac_universal resources.neu
          zip -j ../../out/Focus-linux.zip Focus-linux_x64 resources.neu
          cp resources.neu ../../out/
          cp ../../next-resources.neu ../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/

  verify-windows:
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Run the app on a Windows desktop
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Version $env:VERSION -Out "$PWD/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: check/

  release:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm out/next-resources.neu
          jq -n --arg v "$VERSION" --arg u "https://github.com/${{ github.repository }}/releases/download/v$VERSION/resources.neu" \
            '{applicationId: "app.posturenudge", version: $v, resourcesURL: $u}' > out/update.json
          gh release create "v$VERSION" out/* --title "Focus $VERSION" --notes "$(git log -1 --pretty=%s)" --latest
