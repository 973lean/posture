<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus</title>
<style>
  :root {
    --card: rgba(252, 251, 249, .94); --fg: #1b1b1a; --muted: #85837e; --edge: rgba(0, 0, 0, .06);
    --accent: #2f6f5e; --shadow: 0 10px 30px rgba(0, 0, 0, .14), 0 1px 3px rgba(0, 0, 0, .08);
    /* One colour per reminder. Walk is white in dark mode; in light mode it's graphite so it stays visible. */
    --posture: #2f6f5e; --water: #2563b8; --walk: #3b3b39;
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: rgba(28, 28, 27, .92); --fg: #efeeeb; --muted: #8b8984; --edge: rgba(255, 255, 255, .08); --accent: #8fc7b2; --shadow: 0 10px 30px rgba(0, 0, 0, .5); --posture: #8fc7b2; --water: #7fb2f0; --walk: #f4f3f0; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }

  /* Focus layer: a blurred snapshot of every monitor, shown behind the card. */
  #shade { position: fixed; inset: 0; display: none; opacity: 0; background: rgba(18, 18, 18, .16); transition: opacity .5s ease; }
  #shade img { position: absolute; filter: blur(14px) saturate(1.05); }
  body.focus #shade { display: block; }
  body.in #shade { opacity: 1; }

  .card {
    position: absolute; width: 360px; height: 108px; left: calc(50% - 180px); top: calc(50% - 54px);
    overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 14px;
    background: var(--card); color: var(--fg); border: 1px solid var(--edge); border-radius: 2px;
    box-shadow: var(--shadow); backdrop-filter: blur(24px) saturate(1.4);
    opacity: 0; transform: translateY(6px) scale(.98);
    transition: opacity .35s ease, transform .45s cubic-bezier(.2, .8, .2, 1);
  }
  body.focus .card { box-shadow: 0 24px 60px rgba(0, 0, 0, .28), 0 2px 6px rgba(0, 0, 0, .1); }
  body.in .card { opacity: 1; transform: none; }
  .figure { flex: none; width: 76px; height: 80px; color: var(--accent); }
  .figure svg { width: 100%; height: 100%; display: block; }
  .figure .ghost { color: var(--muted); opacity: .4; stroke-dasharray: 3 2.5; }
  .figure .plumb { stroke-dasharray: 1.5 3; stroke-width: 1.5; opacity: .5; }
  .figure .cue { stroke-width: 1.5; opacity: .8; }
  .figure .desk { color: var(--muted); opacity: .45; stroke-width: 1.5; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
  p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent); opacity: .5; transform-origin: left; }
  .bar.run { transition: transform linear; transform: scaleX(0); }
  /* Settings panel, opened from the tray. */
  :root { --hover: rgba(0, 0, 0, .04); --panel: #fbfaf8; }
  .col, .card { --sel: color-mix(in srgb, var(--accent) 12%, transparent); }
  @media (prefers-color-scheme: dark) { :root { --hover: rgba(255, 255, 255, .05); --panel: #1c1c1b; } }
  #panel {
    position: absolute; inset: 12px; display: none; flex-direction: column;
    background: var(--panel); color: var(--fg); border: 1px solid var(--edge); border-radius: 2px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .18), 0 1px 3px rgba(0, 0, 0, .08);
    opacity: 0; transform: translateY(4px); transition: opacity .2s ease, transform .25s cubic-bezier(.2, .8, .2, 1);
  }
  body.panel #panel { display: flex; }
  body.panel .card, body.panel #shade { display: none; }
  body.panel.open #panel { opacity: 1; transform: none; }
  #panel header, #panel footer { display: flex; align-items: center; gap: 16px; padding: 0 18px; }
  #panel header { height: 50px; border-bottom: 1px solid var(--edge); }
  #panel footer { height: 46px; border-top: 1px solid var(--edge); font-size: 12px; color: var(--muted); }
  .brand { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
  .spacer { margin-right: auto; }
  .cols { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); }
  .col { display: flex; flex-direction: column; padding: 14px 12px 10px; }
  .col + .col { border-left: 1px solid var(--edge); }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 0 6px 12px; }
  .mini { width: 30px; height: 32px; flex: none; color: var(--accent); }
  .mini svg { width: 100%; height: 100%; display: block; stroke-width: 3.2; }
  .mini .ghost { color: var(--muted); opacity: .4; stroke-dasharray: 3 2.5; }
  .mini .plumb { stroke-dasharray: 1.5 3; opacity: .5; }
  .mini .desk, .mini .cue { color: var(--muted); opacity: .45; }
  h2 { font-size: 13px; font-weight: 600; }
  .next { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .opts { display: flex; flex-direction: column; gap: 1px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 10px;
    border-radius: 2px; font-size: 13px; text-align: left; transition: background .12s;
  }
  .opt:hover { background: var(--hover); }
  .opt[aria-pressed="true"] { background: var(--sel); color: var(--accent); font-weight: 500; }
  .opt[aria-pressed="true"]::after { content: ""; width: 5px; height: 5px; border-radius: 1px; background: var(--accent); }
  .row { position: relative; }
  .row .opt { width: 100%; }
  .row .x {
    position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 2px;
    color: var(--muted); font-size: 14px; line-height: 20px; opacity: 0; transition: opacity .12s, background .12s;
  }
  .row:hover .x, .row .x:focus-visible { opacity: 1; }
  .row .x:hover { background: var(--hover); color: var(--fg); }
  .row:hover .opt[aria-pressed="true"]::after { opacity: 0; }
  .custom {
    width: 100%; height: 30px; margin-bottom: 6px; padding: 0 10px; border-radius: 2px;
    border: 1px solid var(--edge); background: transparent; color: var(--fg); font: inherit; font-size: 13px; outline: none;
    transition: border-color .12s;
  }
  .custom::placeholder { color: var(--muted); }
  .custom:focus { border-color: var(--accent); }
  .custom.bad { border-color: #c0533e; animation: nudge .3s; }
  @keyframes nudge { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .saved { display: flex; flex-direction: column; gap: 1px; min-height: 145px; }
  .opts .off { margin-top: 4px; border-top: 1px solid var(--edge); padding-top: 4px; }
  .link { font-size: 12px; color: var(--muted); padding: 4px 0; transition: color .12s; }
  .link:hover { color: var(--fg); }
  .col .link { align-self: flex-start; margin: 8px 10px 0; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .switch { position: relative; width: 28px; height: 16px; border-radius: 2px; background: var(--edge); box-shadow: inset 0 0 0 1px var(--edge); transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 1px; background: var(--muted); transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .15s; }
  .switch[aria-checked="true"] { background: var(--sel); }
  .switch[aria-checked="true"]::after { transform: translateX(12px); background: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .card, #shade, #panel { transition: none; } .card, #panel { transform: none; } }
</style>
</head>
<body>
  <div id="panel" role="dialog" aria-label="Focus settings">
    <header>
      <span class="brand">Focus</span>
      <span class="toggle">Pause all <button class="switch" id="p-pause" role="switch" aria-checked="false"></button></span>
    </header>
    <div class="cols" id="p-cols"></div>
    <footer>
      <span class="toggle">Start at login <button class="switch" id="p-login" role="switch" aria-checked="false"></button></span>
      <span class="spacer"></span>
      <button class="link" id="p-update">Check for updates</button>
      <span id="p-ver"></span>
      <button class="link" id="p-quit">Quit</button>
    </footer>
  </div>
  <div id="shade"></div>
  <div class="card" id="card">
    <div class="figure" id="figure"></div>
    <div>
      <h1 id="title">Head up.</h1>
      <p id="text">Bad posture causes a forward-leaning neck.</p>
    </div>
    <div class="bar" id="bar"></div>
  </div>

  <!-- Stick figures, one per reminder. Same line style: accent = do this, faded/dashed = context. -->
  <template id="fig-posture">
    <!-- Seated side profile: faded head = forward lean, solid = stacked over shoulders. -->
    <svg viewBox="0 0 72 76" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="ghost">
        <path d="M24 30 Q28 25 33 23"/>
        <circle cx="38" cy="19" r="6.5"/>
      </g>
      <path class="cue" d="M37 8 Q32 4 28 6.5 M28 6.5 l3.2 -.6 M28 6.5 l1 3"/>
      <line class="plumb" x1="24" y1="24" x2="24" y2="52"/>
      <circle cx="24" cy="15" r="6.5"/>
      <path d="M24 21.5 V28 Q21.5 40 23 52"/>
      <path d="M24 32 L29 44 H44"/>
      <path d="M23 52 H40 V70"/>
      <path d="M40 44 H68" class="desk"/>
      <rect x="55" y="24" width="12" height="14" rx=".5" class="desk"/>
      <path d="M61 38 V44" class="desk"/>
    </svg>
  </template>
  <template id="fig-water">
    <!-- Standing, raising a glass to drink. -->
    <svg viewBox="0 0 72 76" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="24" cy="14" r="6.5"/>
      <path d="M24 20.5 V46"/>
      <path d="M24 46 L18 70 M24 46 L30 70"/>
      <path d="M24 28 L19 45"/>
      <path d="M24 28 L38 31 L37 22"/>
      <path d="M33 11 L41 12 L39.5 22 L34 21.5 Z"/>
      <path d="M31.5 13.5 L33.4 13.2" stroke-width="1.5"/>
      <g class="ghost">
        <path d="M49 12 q2.6 3.6 0 6 q-2.6 -2.4 0 -6 Z"/>
        <path d="M55 23 q2 2.8 0 4.6 q-2 -1.8 0 -4.6 Z"/>
      </g>
      <path class="desk" d="M8 70 H48"/>
    </svg>
  </template>
  <template id="fig-walk">
    <!-- Mid-stride, with motion lines behind. -->
    <svg viewBox="0 0 72 76" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="34" cy="12" r="6.5"/>
      <path d="M33 18.5 L30 44"/>
      <path d="M30 44 L23 57 L17 69"/>
      <path d="M30 44 L39 56 L45 68"/>
      <path d="M32 26 L25 35 L21 42"/>
      <path d="M32 26 L40 33 L46 38"/>
      <g class="ghost">
        <path d="M5 24 H13 M3 32 H11 M7 40 H13"/>
      </g>
      <path class="desk" d="M8 70 H62"/>
    </svg>
  </template>

<script src="js/neutralino.js"></script>
<script>
const MAX_SAVED = 5;
const short = m => m === 0 ? 'Off' : m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m / 60} hr`;
// "25", "25m", "1.5h", "2 hr" → minutes (1 min – 12 hr), or null.
function parseMinutes(v) {
  const m = /^\s*(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)?\s*$/i.exec(v);
  if (!m) return null;
  const n = Math.round(parseFloat(m[1]) * (/^h/i.test(m[2] || '') ? 60 : 1));
  return n >= 1 && n <= 720 ? n : null;
}
const SHOW_MS = 7000;
const MIN_SHOW_MS = 1000;  // clicks and keys can't dismiss it before this
const $ = id => document.getElementById(id);
const card = $('card'), bar = $('bar'), shade = $('shade');

const TYPES = {
  posture: {
    name: 'Posture', every: 20, saved: [20, 30, 45], title: 'Head up.',
    lines: [
      'Bad posture causes a forward-leaning neck.',
      'Forward head posture strains your neck.',
      'Slouching pulls your head forward. Sit tall.',
      'Ears over shoulders. Your neck will thank you.',
      'Tech neck creeps in slowly. Reset now.',
      'Chin back. Let your head stack over your spine.',
    ],
  },
  water: {
    name: 'Water', every: 45, saved: [30, 45, 60], title: 'Drink some water.',
    lines: [
      'Even mild dehydration can dull your focus.',
      'Sip before you feel thirsty.',
      'A glass now beats a headache later.',
      'Keep a bottle on your desk. Make it easy.',
      'Your brain runs on water. Top it up.',
    ],
  },
  walk: {
    name: 'Walk', every: 60, saved: [60, 90], title: 'Time for a walk.',
    lines: [
      'A few minutes on your feet resets your focus.',
      'Hours of sitting stiffen your back and hips.',
      'Stretch your legs. Rest your eyes.',
      'Walk to refill your water. Two birds, one stone.',
      'Look at something far away while you move.',
    ],
  },
};
const lastLine = {};
function reminder(type) {
  const t = TYPES[type], n = t.lines.length;
  let i; do i = Math.floor(Math.random() * n); while (i === lastLine[type] && n > 1);
  lastLine[type] = i;
  return { title: t.title, text: t.lines[i], figure: type, focus: true };
}

let shownAt = 0, active = false, panelOpen = false, openedAt = 0, paused = false, atLogin = false, checking = false, hideTimer = null, urls = [];
const every = Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [k, t.every]));
const saved = Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [k, [...t.saved]]));
const nextAt = {};
const queue = [];

Neutralino.init();

async function load() {
  try {
    const s = JSON.parse(await Neutralino.storage.getData('settings'));
    if (s.mins) s.posture = s.mins;  // settings from the posture-only version
    for (const k in TYPES) {
      if (Array.isArray(s.saved?.[k])) saved[k] = s.saved[k].filter(n => parseMinutes(String(n))).slice(0, MAX_SAVED);
      if (typeof s[k] === 'number' && (s[k] === 0 || parseMinutes(String(s[k])))) every[k] = s[k];
      // Keep the active interval in the list (older versions had a fixed list).
      if (every[k] && !saved[k].includes(every[k])) saved[k] = [...saved[k], every[k]].slice(-MAX_SAVED);
      saved[k].sort((a, b) => a - b);
    }
    paused = !!s.paused;
  } catch {}
}
function save() { Neutralino.storage.setData('settings', JSON.stringify({ ...every, saved, paused })).catch(() => {}); }
function reset(type) { nextAt[type] = Date.now() + every[type] * 60000; }
function resetAll() { for (const k in TYPES) reset(k); }

// The native tray menu stays tiny; everything else lives in the panel, which stays open while you
// change things and closes when you click elsewhere or press Esc.
function tray() {
  return Neutralino.os.setTray({
    icon: '/resources/tray.png',
    menuItems: [
      { id: 'open', text: 'Open Focus…' },
      { id: 'pause', text: 'Pause all', isChecked: paused },
      { text: '-' },
      { id: 'quit', text: 'Quit' },
    ],
  });
}

function nextText(k) {
  if (!every[k]) return 'Off';
  if (paused) return 'Paused';
  const m = Math.max(0, Math.round((nextAt[k] - Date.now()) / 60000));
  return m < 1 ? 'Next in under a minute' : m < 60 ? `Next in ${m} min` : `Next in ${Math.floor(m / 60)} hr ${m % 60} min`;
}

function optButton(k, m) {
  const b = document.createElement('button');
  b.className = 'opt'; b.textContent = short(m); b.setAttribute('aria-pressed', every[k] === m);
  b.onclick = () => { every[k] = m; reset(k); save(); renderPanel(); };
  return b;
}

function renderPanel() {
  $('p-cols').replaceChildren(...Object.entries(TYPES).map(([k, t]) => {
    const col = document.createElement('section');
    col.className = 'col';
    col.style.setProperty('--accent', `var(--${k})`);
    col.innerHTML = `<div class="col-head"><div class="mini"></div><div><h2>${t.name}</h2><span class="next" data-k="${k}">${nextText(k)}</span></div></div>
      <div class="opts"><input class="custom" maxlength="12" spellcheck="false" aria-label="Custom ${t.name.toLowerCase()} interval"><div class="saved"></div></div>`;
    col.querySelector('.mini').append($('fig-' + k).content.cloneNode(true));

    const input = col.querySelector('.custom');
    const full = saved[k].length >= MAX_SAVED;
    input.placeholder = full ? `Max ${MAX_SAVED} saved` : 'Custom';
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const n = parseMinutes(input.value);
      if (!n || (!saved[k].includes(n) && saved[k].length >= MAX_SAVED)) {
        input.classList.remove('bad'); void input.offsetWidth; input.classList.add('bad');
        return;
      }
      if (!saved[k].includes(n)) saved[k] = [...saved[k], n].sort((a, b) => a - b);
      every[k] = n; reset(k); save(); renderPanel();
    };
    input.oninput = () => input.classList.remove('bad');

    col.querySelector('.saved').append(...saved[k].map(m => {
      const row = document.createElement('div');
      row.className = 'row';
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '×'; x.title = 'Remove'; x.setAttribute('aria-label', `Remove ${short(m)}`);
      x.onclick = () => {
        saved[k] = saved[k].filter(v => v !== m);
        if (every[k] === m) every[k] = 0;
        reset(k); save(); renderPanel();
      };
      row.append(optButton(k, m), x);
      return row;
    }));
    const off = optButton(k, 0);
    off.classList.add('off');
    col.querySelector('.opts').append(off);
    return col;
  }));
  $('p-pause').setAttribute('aria-checked', paused);
  $('p-login').setAttribute('aria-checked', atLogin);
  $('p-ver').textContent = `v${NL_APPVERSION}`;
}

// Refresh only the countdowns, so a half-typed custom value isn't wiped.
function updateNext() { document.querySelectorAll('.next[data-k]').forEach(el => { el.textContent = nextText(el.dataset.k); }); }

async function openPanel() {
  if (active) return;
  panelOpen = true; openedAt = Date.now();
  renderPanel();
  document.body.className = 'panel';
  const W = 600, H = 400, unit = NL_OS === 'Windows' ? (window.devicePixelRatio || 1) : 1;
  await Neutralino.window.setSize({ width: W, height: H });
  // Open next to where the tray was clicked: above it on Windows/Linux, below the menu bar on macOS.
  try {
    const m = await Neutralino.computer.getMousePosition();
    const x = Math.max(8, Math.round(m.x - W * unit + 40 * unit));
    const y = Math.max(8, Math.round(NL_OS === 'Darwin' ? m.y + 8 * unit : m.y - H * unit - 8 * unit));
    await Neutralino.window.move(x, y);
  } catch { await Neutralino.window.center(); }
  await Neutralino.window.show();
  await Neutralino.window.focus();
  requestAnimationFrame(() => document.body.classList.add('open'));
}

async function closePanel() {
  if (!panelOpen) return;
  panelOpen = false;
  document.body.classList.remove('open');
  await new Promise(r => setTimeout(r, 200));
  if (!active) { await Neutralino.window.hide(); document.body.className = ''; setTimeout(next, 800); }
}

$('p-pause').onclick = () => { paused = !paused; resetAll(); save(); tray(); renderPanel(); };
$('p-login').onclick = () => setLogin(!atLogin).then(renderPanel);
$('p-update').onclick = () => manualUpdate();
$('p-quit').onclick = () => Neutralino.app.exit();

// Snapshot every monitor just before the reminder shows, so the card can sit on a blurred
// copy of the whole desktop. Returns coordinates in native window units, or null.
async function tmpDir() { return NL_OS === 'Windows' ? Neutralino.os.getEnv('TEMP') : '/tmp'; }
const PS_SHOT = [
  'Add-Type -AssemblyName System.Windows.Forms, System.Drawing',
  'Add-Type -TypeDefinition \'using System; using System.Runtime.InteropServices; public class Dpi { [DllImport("user32.dll")] public static extern bool SetProcessDPIAware(); }\'',
  '[Dpi]::SetProcessDPIAware() | Out-Null',
  '$v = [System.Windows.Forms.SystemInformation]::VirtualScreen',
  '$p = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds',
  '$full = New-Object System.Drawing.Bitmap $v.Width, $v.Height',
  '[System.Drawing.Graphics]::FromImage($full).CopyFromScreen($v.Left, $v.Top, 0, 0, $full.Size)',
  '$small = New-Object System.Drawing.Bitmap ([int]($v.Width / 4)), ([int]($v.Height / 4))',
  '[System.Drawing.Graphics]::FromImage($small).DrawImage($full, 0, 0, $small.Width, $small.Height)',
  '$small.Save($args[0], [System.Drawing.Imaging.ImageFormat]::Jpeg)',
  '($v.Left, $v.Top, $v.Width, $v.Height, $p.Left, $p.Top, $p.Width, $p.Height) -join " "',
].join('\r\n');
const JXA_SCREENS = 'ObjC.import("AppKit");var s=$.NSScreen.screens,o=[];for(var i=0;i<s.count;i++){var f=s.objectAtIndex(i).frame;o.push([f.origin.x,f.origin.y,f.size.width,f.size.height].join(" "))}o.join(";")';

async function capture() {
  const tmp = await tmpDir();
  if (NL_OS === 'Windows') {
    const ps = `${tmp}\\posture-shot.ps1`, jpg = `${tmp}\\posture-shot.jpg`;
    await Neutralino.filesystem.writeFile(ps, PS_SHOT);
    const n = (await sh(`powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "${ps}" "${jpg}"`)).trim().split(/\s+/).map(Number);
    const virt = { x: n[0], y: n[1], w: n[2], h: n[3] };
    return { virt, primary: { x: n[4], y: n[5], w: n[6], h: n[7] }, shots: [{ file: jpg, ...virt }], unit: window.devicePixelRatio || 1 };
  }
  if (NL_OS === 'Darwin') {
    // NSScreen frames are bottom-left based; flip to top-left using the main screen.
    const raw = (await sh(`osascript -l JavaScript -e '${JXA_SCREENS}'`)).trim().split(';').map(l => l.split(' ').map(Number));
    const mainH = raw[0][3];
    const screens = raw.map(([x, y, w, h], i) => ({ x, y: mainH - (y + h), w, h, file: `${tmp}/posture-shot-${i}.jpg` }));
    await sh(`screencapture -x -t jpg ${screens.map(s => `"${s.file}"`).join(' ')}`);
    const x = Math.min(...screens.map(s => s.x)), y = Math.min(...screens.map(s => s.y));
    const virt = { x, y, w: Math.max(...screens.map(s => s.x + s.w)) - x, h: Math.max(...screens.map(s => s.y + s.h)) - y };
    return { virt, primary: screens[0], shots: screens, unit: 1 };
  }
  return null;
}

async function popup(r) {
  try { await show(r); } catch { active = false; Neutralino.window.hide().catch(() => {}); }
}

async function show({ title, text, figure = 'posture', focus }) {
  clearTimeout(hideTimer);
  active = true;
  document.body.classList.remove('panel', 'open');
  shownAt = Date.now();
  $('figure').replaceChildren($('fig-' + figure).content.cloneNode(true));
  card.style.setProperty('--accent', `var(--${figure})`);
  $('title').textContent = title;
  $('text').textContent = text;

  const cap = focus ? await capture().catch(() => null) : null;
  urls.forEach(URL.revokeObjectURL); urls = [];
  shade.replaceChildren();

  if (cap) {
    const { virt, primary, shots, unit } = cap;
    const css = v => v / unit;
    for (const s of shots) {
      const img = new Image();
      const url = URL.createObjectURL(new Blob([await Neutralino.filesystem.readBinaryFile(s.file)], { type: 'image/jpeg' }));
      urls.push(url);
      Object.assign(img.style, { left: css(s.x - virt.x) + 'px', top: css(s.y - virt.y) + 'px', width: css(s.w) + 'px', height: css(s.h) + 'px' });
      img.src = url;
      shade.append(img);
    }
    card.style.left = css(primary.x - virt.x + primary.w / 2) - 180 + 'px';
    card.style.top = css(primary.y - virt.y + primary.h / 2) - 54 + 'px';
    document.body.classList.add('focus');
    await Neutralino.window.move(virt.x, virt.y);
    await Neutralino.window.setSize({ width: virt.w, height: virt.h });
  } else {
    card.style.left = card.style.top = '';
    document.body.classList.remove('focus');
    await Neutralino.window.setSize({ width: 390, height: 138 });
    await Neutralino.window.center();
  }

  await Neutralino.window.show();
  await Neutralino.window.setAlwaysOnTop(true);

  bar.className = 'bar'; bar.style.transitionDuration = ''; void bar.offsetWidth;
  requestAnimationFrame(() => {
    document.body.classList.add('in');
    bar.style.transitionDuration = SHOW_MS + 'ms'; bar.className = 'bar run';
  });
  shownAt = Date.now();
  hideTimer = setTimeout(dismiss, SHOW_MS);
}

function showing() { return active; }

function dismiss() {
  clearTimeout(hideTimer);
  document.body.classList.remove('in');
  setTimeout(() => {
    if (document.body.classList.contains('in')) return;  // a new popup took over
    Neutralino.window.hide();
    active = false;
    setTimeout(next, 1500);  // brief gap before the next queued reminder
  }, 500);
}

// Reminders due at the same time wait their turn instead of overlapping.
function next() {
  if (!active && !panelOpen && queue.length) popup(reminder(queue.shift()));
}

function userDismiss() { if (active && !panelOpen && Date.now() - shownAt >= MIN_SHOW_MS) dismiss(); }
document.addEventListener('click', userDismiss);
document.addEventListener('keydown', e => { if (panelOpen) { if (e.key === 'Escape') closePanel(); } else userDismiss(); });
// Click outside the panel (the window loses focus) closes it.
Neutralino.events.on('windowBlur', () => { if (panelOpen && Date.now() - openedAt > 400) closePanel(); });

Neutralino.events.on('trayMenuItemClicked', ({ detail: { id } }) => {
  if (id === 'open') return openPanel();
  if (id === 'quit') return Neutralino.app.exit();
  if (id === 'pause') { paused = !paused; resetAll(); save(); tray(); if (panelOpen) renderPanel(); }
});

Neutralino.events.on('windowClose', () => (panelOpen ? closePanel() : userDismiss()));

// Check every 10s against the clock, so throttled timers or sleep never drift the schedule.
setInterval(() => {
  if (paused) return;
  for (const k in TYPES) {
    if (!every[k] || Date.now() < nextAt[k]) continue;
    reset(k);
    if (!queue.includes(k)) queue.push(k);
  }
  next();
  if (panelOpen) updateNext();
}, 10000);

// Start at login: a Run registry value (Windows), a LaunchAgent (macOS) or an autostart
// .desktop file (Linux). --path pins the app folder so resources.neu is found at boot.
const LOGIN_KEY = 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run';
const xml = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function exePath() {
  const a = NL_ARGS[0];
  return /^([a-zA-Z]:)?[\\/]/.test(a) ? a : `${NL_PATH}/${a.split(/[\\/]/).pop()}`;
}
async function loginFile() {
  const home = await Neutralino.os.getEnv('HOME');
  return NL_OS === 'Darwin'
    ? { dir: `${home}/Library/LaunchAgents`, file: `${home}/Library/LaunchAgents/app.posturenudge.plist` }
    : { dir: `${home}/.config/autostart`, file: `${home}/.config/autostart/posture.desktop` };
}
async function readLogin() {
  try {
    if (NL_OS === 'Windows') return (await Neutralino.os.execCommand(`reg query "${LOGIN_KEY}" /v Posture`)).exitCode === 0;
    await Neutralino.filesystem.getStats((await loginFile()).file);
    return true;
  } catch { return false; }
}
async function setLogin(on) {
  const exe = exePath(), dir = NL_PATH;
  try {
    if (NL_OS === 'Windows') {
      await sh(on
        ? `reg add "${LOGIN_KEY}" /v Posture /t REG_SZ /d "\\"${exe}\\" --path=\\"${dir}\\"" /f`
        : `reg delete "${LOGIN_KEY}" /v Posture /f`);
    } else {
      const f = await loginFile();
      if (!on) await Neutralino.filesystem.remove(f.file);
      else {
        await Neutralino.filesystem.createDirectory(f.dir).catch(() => {});
        await Neutralino.filesystem.writeFile(f.file, NL_OS === 'Darwin'
          ? `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>app.posturenudge</string>
  <key>ProgramArguments</key><array><string>${xml(exe)}</string><string>--path=${xml(dir)}</string></array>
  <key>WorkingDirectory</key><string>${xml(dir)}</string>
  <key>RunAtLoad</key><true/>
</dict></plist>
`
          : `[Desktop Entry]
Type=Application
Name=Posture
Exec="${exe}" "--path=${dir}"
Path=${dir}
X-GNOME-Autostart-enabled=true
`);
      }
    }
    atLogin = on;
  } catch {}
}

// Auto-update: every push to main publishes a release (see .github/workflows/release.yml).
// The app fetches its manifest with curl (built into Windows 10+, macOS, Linux), swaps in the
// new resources.neu next to the binary, and restarts while no reminder is on screen.
const MANIFEST = 'https://github.com/973lean/posture/releases/latest/download/update.json';
const newer = (a, b) => {
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
};
async function sh(cmd) {
  const r = await Neutralino.os.execCommand(cmd);
  if (r.exitCode !== 0) throw new Error(r.stdErr);
  return r.stdOut;
}
// Returns 'current', 'updating' or 'failed'.
async function checkForUpdate(onFound) {
  try {
    const m = JSON.parse(await sh(`curl -fsSL "${MANIFEST}"`));
    if (m.applicationId !== NL_APPID || !newer(m.version, NL_APPVERSION)) return 'current';
    const target = `${NL_PATH}/resources.neu`, tmp = `${target}.download`;
    await sh(`curl -fsSL -o "${tmp}" "${m.resourcesURL}"`);
    await Neutralino.filesystem.remove(target).catch(() => {});
    await Neutralino.filesystem.move(tmp, target);
    if (onFound) await onFound(m.version);
    while (showing()) await new Promise(r => setTimeout(r, 1000));
    await Neutralino.app.restartProcess();
    return 'updating';
  } catch { return 'failed'; }  // offline, read-only folder, etc. — try again next time
}

async function manualUpdate() {
  if (checking) return;
  const btn = $('p-update'), say = t => { btn.textContent = t; };
  checking = true; say('Checking…');
  const result = await checkForUpdate(v => { say(`Updating to ${v}…`); return new Promise(r => setTimeout(r, 1200)); });
  checking = false;
  say(result === 'current' ? 'Up to date' : result === 'failed' ? 'Couldn’t check' : 'Restarting…');
  setTimeout(() => say('Check for updates'), 3000);
}
setTimeout(() => checkForUpdate(), 30000);
setInterval(() => checkForUpdate(), 6 * 3600000);

load().then(async () => {
  resetAll();
  atLogin = await readLogin();
  if (atLogin) await setLogin(true);  // refresh, in case the app was moved or updated
  tray();
});
</script>
</body>
