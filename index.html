<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posture Nudge</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --accent:#2a7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; }
  main { text-align:center; padding:16px; }
  input { width:4em; font:inherit; text-align:center; }
  button { font:inherit; padding:.5em 1.2em; margin-top:1em; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  #next { opacity:.7; margin-top:1em; }
</style>
</head>
<body>
<main>
  <h1>🧍 Posture Nudge</h1>
  <p>Remind me every <input id="mins" type="number" min="1" value="20"> minutes</p>
  <button id="toggle">Start</button>
  <p id="next"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const MSG = "Chin back — don't lean your head forward.";
let timer = null, nextAt = 0;
try { $('mins').value = localStorage.getItem('mins') || 20; } catch {}

function nudge() {
  if (Notification.permission === 'granted') new Notification('Posture check', { body: MSG });
  else alert(MSG);
  nextAt = Date.now() + $('mins').value * 60000;
}

$('toggle').onclick = async () => {
  if (timer) { clearInterval(timer); timer = null; $('toggle').textContent = 'Start'; $('next').textContent = ''; return; }
  const m = Math.max(1, +$('mins').value || 20);
  $('mins').value = m;
  try { localStorage.setItem('mins', m); } catch {}
  if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
  nextAt = Date.now() + m * 60000;
  timer = setInterval(() => {
    const left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
    $('next').textContent = `Next nudge in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (left === 0) nudge();
  }, 1000);
  $('toggle').textContent = 'Stop';
};
</script>
</body>
</html>
